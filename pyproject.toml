[project]
name = "aegis-vla"
version = "0.4.4"
description = "Adversarial verification and counterfactual world model harness for sandboxed embodied coding agents"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pybullet>=3.2.6",
    "numpy>=1.26",
    "pillow>=10.0",
    "langgraph>=0.2.50",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
modal = ["modal>=0.73"]
dev = ["pytest>=8"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: full mission runs, about 20 to 40 s each"]
